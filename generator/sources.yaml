  ref: meta
  path: geo/geosite/private.yaml
  behavior: domain
  min_rules: 100
- id: private-ip
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geoip/private.yaml
  behavior: ipcidr
  min_rules: 10
- id: ai-cn
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/category-ai-cn.yaml
  behavior: domain
  min_rules: 50
