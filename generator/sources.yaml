  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/openai.yaml
  behavior: domain
  min_rules: 10
- id: anthropic
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/anthropic.yaml
  behavior: domain
  min_rules: 5
- id: gemini
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/google-gemini.yaml
  behavior: domain
  min_rules: 10
- id: copilot
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/github-copilot.yaml
  behavior: domain
  min_rules: 3
- id: xai
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/xai.yaml
  behavior: domain
  min_rules: 2
- id: google
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/google.yaml
  behavior: domain
  min_rules: 100
- id: github
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/github.yaml
  behavior: domain
  min_rules: 20
- id: telegram
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/telegram.yaml
  behavior: domain
  min_rules: 5
- id: twitter
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/twitter.yaml
  behavior: domain
  min_rules: 5
- id: youtube
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/youtube.yaml
  behavior: domain
  min_rules: 20
- id: netflix
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/netflix.yaml
  behavior: domain
  min_rules: 10
- id: spotify
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/spotify.yaml
  behavior: domain
  min_rules: 10
- id: cn-domain
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geosite/cn.yaml
  behavior: domain
  min_rules: 70000
- id: cn-ip
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geoip/cn.yaml
  behavior: ipcidr
  min_rules: 4000
- id: telegram-ip
  repository: MetaCubeX/meta-rules-dat
  ref: meta
  path: geo/geoip/telegram.yaml
  behavior: ipcidr
  min_rules: 5
packages:
- id: private-domain
  behavior: domain
  sources:
  - private-domain
- id: private-ip
  behavior: ipcidr
  sources:
  - private-ip
- id: ai-cn-domain
  behavior: domain
  sources:
  - ai-cn
- id: ai-proxy-domain
  behavior: domain
  sources:
  - openai
  - anthropic
  - gemini
  - copilot
  - xai
- id: chat-domain
  behavior: domain
  sources:
  - telegram
- id: proxy-domain
  behavior: domain
  sources:
  - google
  - github
  - twitter
  - youtube
  - netflix
  - spotify
- id: chat-ip
  behavior: ipcidr
  sources:
  - telegram-ip
- id: platform-direct-domain
  behavior: domain
  sources: []
- id: platform-direct-ip
  behavior: ipcidr
  sources: []
- id: cn-domain
  behavior: domain
  sources:
  - cn-domain
- id: cn-ip
  behavior: ipcidr
  sources:
  - cn-ip
routing:
- type: rule-set
  provider: private-domain
  target: DIRECT
- type: rule-set
  provider: private-ip
  target: DIRECT
  no_resolve: true
- type: personal
- type: remote
- type: rule-set
  provider: ai-cn-domain
  target: DIRECT
- type: rule-set
  provider: ai-proxy-domain
  target: Proxy
- type: rule-set
  provider: chat-domain
  target: Proxy
- type: rule-set
  provider: proxy-domain
  target: Proxy
- type: rule-set
  provider: platform-direct-domain
  target: DIRECT
- type: rule-set
  provider: cn-domain
  target: DIRECT
- type: rule-set
  provider: chat-ip
  target: Proxy
- type: rule-set
  provider: platform-direct-ip
  target: DIRECT
- type: rule-set
  provider: cn-ip
  target: DIRECT
- type: match
  target: Proxy
